# Asset Forge manifest — the catalog. Prompts are DATA: add a row, regenerate.
#
# Per-entry schema:
#   id         : unique slug = output filename <id>.png. For real game assets this
#                MUST equal the game's monster/building id so the file lands where
#                the loader expects (public/monsters/<id>.png etc.).
#   category   : monster | building | deity | portrait | deco
#   universe   : medieval_fantasy | wushu | tower_conquest | post_apocalyptic
#   zone       : sub-zone / hunting spot (groups style references for coherence)
#   subject    : concrete description injected into the prompt
#   palette    : dominant colours (injected into the prompt)
#   reference  : (optional) id of an already-produced asset whose raw with_bg is
#                reused as a style reference. FIRST entry of a zone has none (anchor).
#   out        : (optional) override the published path under public/.
#
# Outputs:
#   raw  (with_bg, source of truth) -> public/<folder>/raw/<id>.png   [gitignored]
#   game (no_bg, shipped)           -> public/<folder>/<id>.png       [committed]
#
# Idempotent: a run SKIPS any asset whose game-ready public/<folder>/<id>.png
# already exists, and only makes what's MISSING — so you can add new zones/worlds
# below and run once without clobbering existing art. Use --force to regenerate.

assets:
  # ══ medieval_fantasy — REAL roster (ids match src/data/monsters.js) ══════════

